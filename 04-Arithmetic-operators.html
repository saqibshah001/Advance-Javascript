<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Arithmetic Operators -->
    <script>
        console.log("Operators in JS")
        a = 10;
        b = 4;
        console.log("a + b =", a+b)
        console.log("a - b =", a-b )
        console.log("a / b =", a/b)
        // is line ka ye matlb hai ky a ki value 10 hai or b ki 4 hai tu ab eysy multipilcation hogi jesy bi ki value4 hai tu ab 10 , 4 sy 4 time multiply hoga 10 X 10 X 10 X 10 agar b ki value for example 5 hoti tu 5 time multiply hota 
        console.log("a ** b =", a**b)

        console.log("a % b =", a%b)

        // ye is line sy 1 + ho raha hai a mai ++ ka matlb 1 plue hoga pehly phir 10 print hoga tu vlue 11 ho jaye gi 
        console.log("++a =", ++a)
        console.log("a =", a)

        // is mai bhi value 11 hogi but pehly 10 thi vlue phir -- ki waja sy 1 + ho raha hai is liye vlue 11 ho rahi hai
        console.log("a-- =", a--)

        // 7 : 40
    </script>
</body>
</html>
