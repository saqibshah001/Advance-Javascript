<script>
    // Ham Array ky uder multiple values or multiples types ki value ak sath dy sakhty hain 
    let marks_class_12 =[52, 84, 47, 64, null, false, "Not Present"] 
    console.log(marks_class_12)

    // agar mai multiple Arrays mai sy ak value print karwana chata hu tu mai ye karo ga 
    console.log(marks_class_12[1])
    console.log(marks_class_12[2])
    console.log(marks_class_12[3])
    console.log(marks_class_12[4])
    console.log(marks_class_12[5])
    console.log(marks_class_12[6])
    
    // ye wo arry hain ju hamary code mai hai hi nahi or ham print karwa rahy hain is liye undefined aaraha hai 
    console.log(marks_class_12[7])
    
    // ab mai chata hu ky mai Array mai ak or new value add karo tu mai eysy karo ga 
    marks_class_12[7] =32
    console.log(marks_class_12[7])
    
    // agar mujhe mujhe arry ki length pata karni hai tu mai kesy karo ga length ka matlab hai ky meri arry ky under kitni values hain
    console.log(marks_class_12.length)
    
    // ab mai chata hu ky mai Array ki value ko edit karo tu mai esy karo ga 
    marks_class_12[0] = 96
    console.log(marks_class_12[0])

    // agar hamy arry ki type check hai tu eysy hogi
    console.log(typeof marks_class_12)
</script>
