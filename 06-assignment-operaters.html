<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Assignment operators -->
     <!--
     
     +=
     -=
     *=
     /=
     
     -->
    <script>
        let assignment = 2;
        assignment += 5;
        console.log("a is now = ", assignment)
         assignment -= 5;
        console.log("a is now = ", assignment)
         assignment *= 5;
        console.log("a is now = ", assignment)
         assignment /= 5;
        console.log("a is now = ", assignment)
    </script>
</body>
</html>
